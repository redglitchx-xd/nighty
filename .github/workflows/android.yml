name: Nighty Android APK Build (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - nighty-build
      - nighty-ui-v2
    paths:
      - 'crates/**'
      - 'launcher/**'
      - 'packaging/android/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'research-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Nighty Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      APEX_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4

      - name: Setup local debug keystore
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          path = Path('.local/android/debug.keystore')
          path.parent.mkdir(parents=True, exist_ok=True)
          val = os.environ.get('DEV_KEYSTORE', '')
          if val:
              path.write_bytes(base64.b64decode(val, validate=True))
              path.chmod(0o600)
              print('Restored DEV_KEYSTORE from secret.')
          else:
              subprocess.run(['keytool', '-genkeypair', '-keystore', str(path), '-storepass', 'android',
                              '-keypass', 'android', '-alias', 'androiddebugkey', '-keyalg', 'RSA',
                              '-validity', '3650', '-dname', 'CN=Apex Android,O=Apex,C=US'], check=True)
              print('Generated fresh debug keystore.')
          PY

      - name: Set up Java 25 (Temurin) for Mojang assets
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Java 17 (Temurin) for Gradle and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android toolchain (SDK, NDK, target)
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup target add aarch64-linux-android

      - name: Check public tree
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'

      - name: Prepare private engine inputs from Mojang downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME_25_X64"

      - name: Build optimized public APK
        run: |
          python3 tools/android_build.py --abi arm64-v8a --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0

      - name: Collect APK
        run: |
          mkdir -p dist
          cp .local/android/apk/arm64-v8a/apex-android-public.apk dist/nighty-arm64.apk
          ls -lh dist/

      - name: Generate SHA-256 checksum
        working-directory: dist
        run: sha256sum nighty-arm64.apk > SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nighty-arm64.apk
          path: |
            dist/nighty-arm64.apk
            dist/SHA256SUMS.txt

      - name: Publish to GitHub Releases (v1.0.0-alpha.3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### [>] Nighty Android (ARM64) - Alpha 3

          Nighty Android is an unofficial ARM64 client for Minecraft Java Edition 26.3, built on Apex Android.
          Alpha 3 continues the deeper Nighty purple liquid-glass rebuild and keeps the alpha feature set.

          #### Credits:
          - **Android Edition:** Actively ported, optimized, and maintained for ARM64 mobile devices by **RedGlitchX** ([@tubers9999](https://github.com/tubers9999)).
          - Upstream attribution is preserved in `LICENSE` and `THIRD_PARTY_NOTICES.md`.

          #### Alpha features:
          - [+] Nighty Purple Liquid Glass: deeper violet accents, translucent layered panels, the new Nighty logo, and theme choices saved on the device.
          - [+] Apex-Only Mod Set: exactly four built-in mods (Minimap, Zoom, Recipes, SmartF3). External .hmod/.hnmod mods are disabled on Android.
          - [+] Add-on Support Kept: resource packs, shader packs, and data packs still install from files and the catalog.
          - [+] Background Audio Off by Default: launcher BGM no longer starts on its own and remembers the muted choice.
          - [+] Resizable Touch Controls: control sizes can be changed in Settings and stay clamped in the HUD editor.
          - [+] Visual PvP Hitmarker: accent-coloured crosshair feedback on landed hits, following the active Nighty theme.
          - [+] Live Keystrokes & CPS Overlay: WASD + Space visualizer with 1-second CPS counters.
          - [+] 1-Tap Ultra FPS Booster: entity culling, cave culling, animated textures, and LOD optimizations.
          - [+] Custom Media Pickers: import wallpapers, videos, or audio from phone storage.
          - [+] Live Performance Stats Overlay: real-time FPS, frame timings, CPU/GPU graph.
          - [+] Native Storage Access (SAF): Android DocumentsProvider integrated seamlessly.

          #### Security and privacy:
          - Nighty is unofficial and is not affiliated with, endorsed by, or connected to Mojang Studios, Microsoft, Starling or Zalith. Starling and Zalith are named only as UI inspiration; no code is copied from them.
          - No Mojang game files are bundled in the APK. Game inputs are prepared from hash-pinned sources and are not shipped as game resources.
          - Settings stay on your device. In the app, downloads happen only from sources you select, such as local files and the catalog you browse.
          - The source and this GitHub Actions workflow are public, so the build inputs and release provenance can be reviewed.
          - Verify `SHA256SUMS.txt` against the APK before installing (`sha256sum -c SHA256SUMS.txt`). A matching hash proves the file is the one published here, not that it is free of malware. Antivirus tools may flag unfamiliar native builds; no tool can promise it will always consider Nighty safe.
          EOF
          {
            printf '\n#### SHA-256\n\n'
            printf 'Verify the download from the published `SHA256SUMS.txt`.\n\n```\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
          } >> release_notes.md

          gh release create v1.0.0-alpha.3 dist/nighty-arm64.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Nighty Android (ARM64) - Alpha 3" \
            --notes-file release_notes.md
