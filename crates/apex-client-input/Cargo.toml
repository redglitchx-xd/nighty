[package]
name = "apex-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
apex-client-core = { path = "../apex-client-core" }
winit = "0.30.13"
# The window icon.
apex-theme = { path = "../apex-theme" }
png = "0.18"
# The DualSense's trigger effects (the `controllers` feature).
apex-dualsense = { path = "../apex-dualsense", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[features]
controllers = ["dep:apex-dualsense"]

[lints]
workspace = true
